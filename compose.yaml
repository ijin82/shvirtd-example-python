include:
  - proxy.yaml

services:
  web:
    build:
      dockerfile: Dockerfile.python
    # Сервис должен всегда перезапускаться в случае ошибок.
    # лучше бы было видимо "unless-stopped" потому что
    # в этом случае после ручной остановки перезапуска не будет
    restart: always
    environment:
      # это имя сервиса из этого файла
      - DB_HOST=db
      # Docker Compose автоматически читает .env из корня проекта для подстановки
      # переменные из .env
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_NAME=${MYSQL_DATABASE}
    networks:
      # Контейнер должен работать в bridge-сети с названием 
      # backend и иметь фиксированный ipv4-адрес 172.20.0.5
      # тип bridge по умолчанию
      backend:
        ipv4_address: 172.20.0.5
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8
    # Сервис должен всегда перезапускаться в случае ошибок.
    restart: always
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/mysql
    networks:
      # Контейнер должен работать в bridge-сети с названием 
      # backend и иметь фиксированный ipv4-адрес 172.20.0.10      
      backend:
        ipv4_address: 172.20.0.10
    healthcheck:
      # встроенный скрипт в официальном образе mysql:8
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s

# db_data — это Docker named volume (именованный том). Он хранится в 
# Docker's data directory (обычно /var/lib/docker/volumes/db_data/), а не в 
# папке проекта. Поэтому он не попадёт в git — для git его просто не существует.
volumes:
  db_data:
